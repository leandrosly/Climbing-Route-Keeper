services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.crk.rule=Host(`crk.${BASE_DOMAIN}`)
      - traefik.http.routers.crk.entrypoints=https
      - traefik.http.routers.crk.tls=true
      - traefik.http.services.crk.loadbalancer.server.port=80

networks:
  proxy:
    external: true
